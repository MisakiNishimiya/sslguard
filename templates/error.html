{% extends "base.html" %}

{% block title %}Error - SSLGuard{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2 text-center">
        <div class="card">
            <div class="card-body" style="padding: 3rem;">
                <h1 style="font-size: 4rem; color: #dc3545;">
                    <i class="bi bi-exclamation-triangle"></i>
                </h1>
                <h2>{{ error }}</h2>
                <p class="text-muted">Something went wrong. Please try again.</p>
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary mt-3">
                    <i class="bi bi-chevron-left"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
