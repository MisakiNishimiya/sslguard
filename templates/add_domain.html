{% extends "base.html" %}

{% block title %}Add Domain - SSLGuard{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1><i class="bi bi-plus-lg"></i> Add New Domain</h1>
        
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="hostname" class="form-label">Hostname</label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-globe"></i>
                            <input type="text" class="form-control" id="hostname" name="hostname" 
                                   placeholder="example.com" autocomplete="off" required>
                        </div>
                        <small class="form-text text-muted">Domain name or IP address to scan</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="port" class="form-label">Port</label>
                        <input type="number" class="form-control" id="port" name="port" 
                               value="443" min="1" max="65535" required>
                        <small class="form-text text-muted">Default: 443 (HTTPS)</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="owner" class="form-label">Owner</label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-person"></i>
                            <input type="text" class="form-control" id="owner" name="owner" 
                                   placeholder="Team or person responsible" autocomplete="off" required>
                        </div>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Add Domain</button>
                        <a href="{{ url_for('domains') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
