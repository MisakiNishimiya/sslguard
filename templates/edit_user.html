{% extends "base.html" %}

{% block title %}Edit User - SSLGuard{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1><i class="bi bi-pencil-square"></i> Edit User: {{ user.username }}</h1>
        
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="role" class="form-label">Role</label>
                        <select class="form-control" id="role" name="role" required>
                            <option value="viewer" {% if user.role == 'viewer' %}selected{% endif %}>
                                Viewer (read-only access)
                            </option>
                            <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>
                                Administrator (full access)
                            </option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">New Password (optional)</label>
                        <div class="password-wrapper">
                            <i class="bi bi-lock left-icon"></i>
                            <input type="password" class="form-control" id="password" name="password" 
                                   placeholder="Leave blank to keep current password" autocomplete="new-password">
                            <button type="button" class="password-toggle" data-toggle="password" data-target="#password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <small class="form-text text-muted">If provided, must be at least 6 characters</small>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save Changes</button>
                        <a href="{{ url_for('users') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.querySelectorAll('.password-toggle').forEach(button => {
    button.addEventListener('click', function(e) {
        e.preventDefault();
        const targetId = this.getAttribute('data-target');
        const input = document.querySelector(targetId);
        const icon = this.querySelector('i');
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    });
});
</script>
{% endblock %}
